name: Build Docker Image

on:
  push:
    branches: [ "master" ] # Monitora a branch principal

jobs:
  build:
    # Esta condição garante que o workflow só rode se o push veio de um merge de Pull Request
    if: github.event.commits[0] != null && (contains(github.event.head_commit.message, 'Merge pull request') || contains(github.event.head_commit.message, 'Merge branch'))
    
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Fazer login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildar e enviar a imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.actor }}/webcameras:latest
