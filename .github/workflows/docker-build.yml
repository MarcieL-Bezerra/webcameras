name: Build Docker Image

on:
  push:
    branches: [ "master" ] # Monitora a branch principal

jobs:
  build:
    if: github.event.commits != null && (contains(github.event.head_commit.message, 'Merge pull request') || contains(github.event.head_commit.message, 'Merge branch'))
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Fazer login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASSO NOVO: Converte o nome do usuário/repositório para minúsculo de forma segura
      - name: Set up lower case owner name
        id: string
        run: |
          echo "owner_lowercase=${OWNER,,}" >> ${GITHUB_OUTPUT}
        env:
          OWNER: ${{ github.actor }}

      - name: Buildar e enviar a imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Usamos a saída do passo anterior (steps.string.outputs.owner_lowercase)
          tags: ghcr.io/${{ steps.string.outputs.owner_lowercase }}/webcameras:latest
